global:
  scrape_interval: 5s #visita la appi cada 5 segundos

rule_files:
  - 'prometheus-rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'nodejs-api'
    static_configs:
      - targets: ['app:3000'] # Usar el alias definido en el Dockerfile